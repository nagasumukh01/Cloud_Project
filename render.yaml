services:
  - type: web
    name: trustproof-cloud-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TPC_ENV
        value: production
      - key: TPC_REQUIRE_AUTH
        value: "false"
      - key: TPC_DATA_DIR
        value: ./data
